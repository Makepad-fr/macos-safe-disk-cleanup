name: Validate skill

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on:
      group: macos-skill-isolated
      labels: [self-hosted, Linux, X64, macos-skill-vm]
    timeout-minutes: 5
    steps:
      - name: Check out the package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'
      - name: Install the pinned reference validator
        run: |
          python3 -m venv "$RUNNER_TEMP/skill-validation"
          "$RUNNER_TEMP/skill-validation/bin/python" -m pip install 'git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref'
      - name: Check CI trust boundary
        run: |
          "$RUNNER_TEMP/skill-validation/bin/python" .github/scripts/check_ci_policy.py
          "$RUNNER_TEMP/skill-validation/bin/python" -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Validate Agent Skills package
        run: '"$RUNNER_TEMP/skill-validation/bin/skills-ref" validate "$GITHUB_WORKSPACE"'
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
